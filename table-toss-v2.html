<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Table Toss v2 — Heavy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  min-height: 100vh;
  font-family: 'EB Garamond', Georgia, serif;
  background-color: #e8dcc8;
  background-image:
    radial-gradient(ellipse at 15% 10%, rgba(196,160,96,0.12) 0%, transparent 55%),
    radial-gradient(ellipse at 85% 90%, rgba(160,120,72,0.08) 0%, transparent 55%);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 24px 80px;
  overflow: hidden;
}

.folder-outer {
  width: 100%;
  max-width: 1380px;
  display: flex;
  flex-direction: column;
  animation: toss 1.1s cubic-bezier(0.13, 0.8, 0.2, 1) forwards;
  opacity: 0;
}

@keyframes toss {
  0% {
    opacity: 0;
    transform: translateY(calc(100vh)) translateX(-60px) rotate(4deg) scale(0.92);
  }
  /* Flying up — fast, aggressive */
  25% {
    opacity: 1;
    transform: translateY(-30px) translateX(8px) rotate(-1.8deg) scale(1.02);
  }
  /* First slam down */
  42% {
    transform: translateY(6px) translateX(-2px) rotate(0.8deg) scale(0.998);
  }
  /* Bounce back up — smaller */
  55% {
    transform: translateY(-10px) translateX(2px) rotate(-0.5deg) scale(1.005);
  }
  /* Second settle */
  70% {
    transform: translateY(3px) translateX(0) rotate(0.2deg) scale(0.999);
  }
  /* Tiny final correction */
  85% {
    transform: translateY(-2px) rotate(-0.08deg) scale(1.001);
  }
  100% {
    opacity: 1;
    transform: translateY(0) translateX(0) rotate(0deg) scale(1);
  }
}

/* Shadow animation — starts as nothing, SLAMS into full contact shadow */
.folder-body {
  position: relative;
  min-height: 893px;
  border-radius: 3px 14px 16px 16px;
  overflow: hidden;
  animation: shadowSlam 1.1s cubic-bezier(0.13, 0.8, 0.2, 1) forwards;
}

@keyframes shadowSlam {
  0% {
    box-shadow:
      inset 0 3px 0 rgba(255,255,255,0.3),
      inset 3px 0 0 rgba(255,255,255,0.18),
      inset 0 -3px 0 rgba(60,35,10,0.18),
      inset -3px 0 0 rgba(60,35,10,0.12),
      0 1px 0 #c8ad80, 0 2px 0 #c4a878, 0 3px 0 #bfa070,
      0 4px 0 #ba9a68, 0 5px 0 #b59460, 0 6px 0 #b08e58,
      0 7px 0 #ab8850, 0 8px 0 #a68248,
      1px 0 0 #c8ad80, 2px 1px 0 #c4a878, 3px 2px 0 #bfa070,
      4px 3px 0 #ba9a68, 5px 4px 0 #b59460, 6px 5px 0 #b08e58,
      7px 6px 0 #ab8850, 8px 7px 0 #a68248,
      0 2px 4px rgba(50,30,10,0.02);
  }
  /* Impact moment — shadow blows out wide and soft */
  42% {
    box-shadow:
      inset 0 3px 0 rgba(255,255,255,0.3),
      inset 3px 0 0 rgba(255,255,255,0.18),
      inset 0 6px 8px rgba(255,255,255,0.1),
      inset 0 -3px 0 rgba(60,35,10,0.18),
      inset -3px 0 0 rgba(60,35,10,0.12),
      inset 0 -6px 8px rgba(60,35,10,0.06),
      0 1px 0 #c8ad80, 0 2px 0 #c4a878, 0 3px 0 #bfa070,
      0 4px 0 #ba9a68, 0 5px 0 #b59460, 0 6px 0 #b08e58,
      0 7px 0 #ab8850, 0 8px 0 #a68248,
      1px 0 0 #c8ad80, 2px 1px 0 #c4a878, 3px 2px 0 #bfa070,
      4px 3px 0 #ba9a68, 5px 4px 0 #b59460, 6px 5px 0 #b08e58,
      7px 6px 0 #ab8850, 8px 7px 0 #a68248,
      6px 12px 25px rgba(50,30,10,0.25),
      10px 20px 50px rgba(50,30,10,0.18),
      16px 30px 70px rgba(50,30,10,0.1);
  }
  100% {
    box-shadow:
      inset 0 3px 0 rgba(255,255,255,0.3),
      inset 3px 0 0 rgba(255,255,255,0.18),
      inset 0 6px 8px rgba(255,255,255,0.1),
      inset 0 -3px 0 rgba(60,35,10,0.18),
      inset -3px 0 0 rgba(60,35,10,0.12),
      inset 0 -6px 8px rgba(60,35,10,0.06),
      0 1px 0 #c8ad80, 0 2px 0 #c4a878, 0 3px 0 #bfa070,
      0 4px 0 #ba9a68, 0 5px 0 #b59460, 0 6px 0 #b08e58,
      0 7px 0 #ab8850, 0 8px 0 #a68248,
      1px 0 0 #c8ad80, 2px 1px 0 #c4a878, 3px 2px 0 #bfa070,
      4px 3px 0 #ba9a68, 5px 4px 0 #b59460, 6px 5px 0 #b08e58,
      7px 6px 0 #ab8850, 8px 7px 0 #a68248,
      4px 10px 20px rgba(50,30,10,0.2),
      8px 16px 40px rgba(50,30,10,0.15),
      12px 24px 60px rgba(50,30,10,0.08);
  }
}

/* Tabs slam in right after the folder lands */
.folder-tabs {
  display: flex;
  margin-left: 0;
  position: relative;
  z-index: 20;
  margin-bottom: -3px;
  animation: tabsSlam 0.35s cubic-bezier(0.22, 0.9, 0.36, 1) 0.35s forwards;
  opacity: 0;
}
@keyframes tabsSlam {
  0% { opacity: 0; transform: translateY(12px) scale(0.97); }
  60% { opacity: 1; transform: translateY(-2px) scale(1.005); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

.folder-tabs button {
  font-family: 'Times New Roman', Times, serif;
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 9px 24px 12px;
  border: none;
  background: #cdbfa3;
  color: #6b5440;
  cursor: pointer;
  outline: none;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 -2px 4px rgba(0,0,0,0.06);
}
.folder-tabs button:first-child { border-radius: 10px 0 0 0; }
.folder-tabs button:last-child { border-radius: 0 10px 0 0; }
.folder-tabs button.active {
  background: #e0d4b8;
  color: #1a120a;
  font-weight: 600;
  z-index: 3;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 -2px 4px rgba(0,0,0,0.04);
}

.folder-body svg.panel { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
.panel-back { z-index: 1; }
.panel-front { z-index: 3; pointer-events: none; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.12)); }

.dip-area { position: absolute; z-index: 5; top: 18px; left: 28px; }
.dip-title { font-family: 'EB Garamond', serif; font-size: 32px; color: #1a120a; line-height: 1.15; margin-bottom: 4px; }
.dip-eyebrow { font-family: 'Times New Roman', serif; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: #8a6e3e; }

.front-content { position: absolute; z-index: 10; top: 150px; left: 40px; right: 40px; bottom: 32px; padding-top: 24px; }

/* Content slides in from below with stagger */
.front-content > * {
  animation: cardSlide 0.5s cubic-bezier(0.22, 0.9, 0.36, 1) forwards;
  opacity: 0;
}
.front-content > *:nth-child(1) { animation-delay: 0.55s; }
.front-content > *:nth-child(2) { animation-delay: 0.72s; }
.front-content > *:nth-child(3) { animation-delay: 0.88s; }

@keyframes cardSlide {
  0% { opacity: 0; transform: translateY(20px); }
  60% { opacity: 1; transform: translateY(-3px); }
  100% { opacity: 1; transform: translateY(0); }
}

.enron-card {
  padding: 20px 24px;
  background: rgba(10,10,10,0.88);
  backdrop-filter: blur(12px);
  border-left: 4px solid #C49032;
  border-radius: 12px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
}
.enron-title { font-family: 'EB Garamond', serif; font-size: 18px; color: #C49032; }
.enron-sub { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: rgba(255,255,255,0.45); margin-top: 4px; }

.placeholder-card {
  padding: 18px 22px;
  border: 1.5px dashed #c4b494;
  border-radius: 12px;
  margin-top: 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: #b4a080;
}

.replay-btn {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  padding: 8px 20px;
  background: rgba(10,10,10,0.85);
  color: #C49032;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  z-index: 100;
  animation: replayFade 0.3s ease 1.5s forwards;
  opacity: 0;
}
@keyframes replayFade { to { opacity: 1; } }
</style>
</head>
<body>

<div class="folder-outer" id="folder">
  <div class="folder-tabs">
    <button class="active">Projects</button>
    <button>About</button>
    <button>Contact</button>
  </div>
  <div class="folder-body">
    <svg class="panel panel-back" viewBox="0 0 960 700" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M 0 0 L 952 0 Q 960 0, 960 8 L 960 690 Q 960 700, 950 700 L 10 700 Q 0 700, 0 690 Z" fill="#e0d4b8" stroke="none"/>
    </svg>
    <svg class="panel panel-front" viewBox="0 0 960 700" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M 0 87 Q 8 75, 20 75 L 200 75 Q 218 75, 230 63 L 308 18 Q 318 8, 332 8 L 950 8 Q 960 8, 960 18 L 960 690 Q 960 700, 950 700 L 10 700 Q 0 700, 0 690 Z" fill="#f0e6d0" stroke="none"/>
    </svg>
    <div class="dip-area">
      <div class="dip-title">What I've built</div>
      <div class="dip-eyebrow">Research & Projects</div>
    </div>
    <div class="front-content">
      <div class="enron-card">
        <div class="enron-title">Organizational Knowledge Decay Modeling</div>
        <div class="enron-sub">517K Enron emails · BERTopic · Graph centrality · Departure simulation</div>
      </div>
      <div class="placeholder-card">Next project — coming soon</div>
      <div class="placeholder-card">Next project — coming soon</div>
    </div>
  </div>
</div>

<button class="replay-btn" onclick="replay()">Replay</button>
<script>
function replay() {
  document.querySelectorAll('[style]').forEach(function(el) { el.removeAttribute('style'); });
  var f = document.getElementById('folder');
  f.style.animation = 'none';
  f.offsetHeight;
  f.style.animation = '';
  f.querySelector('.folder-tabs').style.animation = 'none';
  f.querySelector('.folder-tabs').offsetHeight;
  f.querySelector('.folder-tabs').style.animation = '';
  f.querySelector('.folder-body').style.animation = 'none';
  f.querySelector('.folder-body').offsetHeight;
  f.querySelector('.folder-body').style.animation = '';
  f.querySelectorAll('.front-content > *').forEach(function(c) {
    c.style.animation = 'none'; c.offsetHeight; c.style.animation = '';
  });
  var btn = document.querySelector('.replay-btn');
  btn.style.animation = 'none'; btn.offsetHeight; btn.style.animation = '';
}
</script>
</body>
</html>
