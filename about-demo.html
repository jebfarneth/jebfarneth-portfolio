<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Tab Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'EB Garamond', Georgia, serif;
  background-color: #e8dcc8;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 36px 24px 0;
  min-height: 100vh;
}

.folder-outer {
  width: 100%;
  max-width: 1380px;
}

/* TABS */
.folder-tabs {
  display: flex;
  margin-left: 20px;
  position: relative;
  z-index: 20;
}

.folder-tabs button {
  font-family: 'Times New Roman', serif;
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 8px 22px 10px;
  border: none;
  background: #cdbfa3;
  color: #6b5440;
  cursor: pointer;
  outline: none;
  position: relative;
}

.folder-tabs button.active {
  background: #e0d4b8;
  color: #1a120a;
  font-weight: 700;
}

/* FOLDER BODY */
.folder-body {
  position: relative;
  min-height: 893px;
  border-radius: 0 12px 12px 12px;
  overflow: hidden;
}

/* SVG PANELS */
.panel {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}

/* DIP AREA */
.dip-area {
  position: absolute;
  top: 20px;
  left: 24px;
  z-index: 10;
  width: 220px;
}

.dip-title {
  font-family: 'EB Garamond', serif;
  font-size: 32px;
  font-weight: 500;
  color: #1a120a;
  line-height: 1.1;
}

.dip-eyebrow {
  font-family: 'Times New Roman', serif;
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #8a7258;
  margin-top: 4px;
}

/* FRONT CONTENT */
.front-content {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 5;
  padding: 28px 32px 40px 32px;
}

/* ── ABOUT LAYOUT ── */
.about-layout {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 32px;
  height: 100%;
  padding-top: 60px;
}

/* LEFT COLUMN */
.about-left {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.about-photo-wrap {
  width: 100%;
  aspect-ratio: 3/4;
  max-height: 320px;
  border-radius: 6px;
  overflow: hidden;
  box-shadow:
    0 2px 0 #c8b894,
    0 4px 0 #b8a882,
    0 6px 16px rgba(60,40,20,0.18);
}

.about-photo-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 15%;
  display: block;
}

.about-name {
  font-family: 'EB Garamond', serif;
  font-size: 22px;
  font-weight: 600;
  color: #1a120a;
  line-height: 1.2;
}

.about-degree {
  font-family: 'EB Garamond', serif;
  font-size: 15px;
  color: #8a7258;
  line-height: 1.8;
  margin-top: 4px;
}

.about-tagline {
  font-family: 'EB Garamond', serif;
  font-style: italic;
  font-size: 15px;
  color: #8a7258;
  margin-top: 2px;
}

.about-divider {
  height: 1px;
  background: linear-gradient(to right, #c4b090, transparent);
  margin: 4px 0;
}

.about-interests {
  font-family: 'EB Garamond', serif;
  font-size: 15px;
  color: #8a7258;
  line-height: 1.7;
}

.about-interests span {
  display: block;
  font-family: 'Times New Roman', serif;
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #a09080;
  margin-bottom: 4px;
}

/* RIGHT COLUMN — resume embed */
.about-right {
  display: flex;
  flex-direction: column;
}

.resume-embed {
  flex: 1;
  background: #fff;
  border-radius: 4px;
  box-shadow:
    0 2px 0 #c8b894,
    0 4px 0 #b8a882,
    0 8px 32px rgba(60,40,20,0.15);
  overflow: hidden;
  min-height: 700px;
}

.resume-embed iframe {
  width: 100%;
  height: 100%;
  border: none;
  min-height: 700px;
}

/* placeholder for demo */
.resume-placeholder {
  width: 100%;
  height: 100%;
  min-height: 700px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #fafafa;
  color: #aaa;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
}
</style>
</head>
<body>
<div class="folder-outer">

  <!-- TABS -->
  <div class="folder-tabs">
    <button>PROJECTS</button>
    <button class="active">RESUME</button>
    <button>CONTACT</button>
  </div>

  <!-- FOLDER BODY -->
  <div class="folder-body">

    <!-- BACK PANEL -->
    <svg class="panel" viewBox="0 0 1380 893" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M 0 0 L 1380 0 L 1380 883 Q 1380 893, 1370 893 L 10 893 Q 0 893, 0 883 Z" fill="#e0d4b8" stroke="none"/>
    </svg>

    <!-- FRONT PANEL -->
    <svg class="panel" viewBox="0 0 1380 893" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M 0 87 Q 8 75, 20 75 L 200 75 Q 218 75, 230 63 L 308 18 Q 318 8, 332 8 L 1370 8 Q 1380 8, 1380 18 L 1380 883 Q 1380 893, 1370 893 L 10 893 Q 0 893, 0 883 Z" fill="#f0e6d0" stroke="none"/>
    </svg>

    <!-- DIP AREA -->
    <div class="dip-area">
      <div class="dip-eyebrow">Background</div>
    </div>

    <!-- FRONT CONTENT -->
    <div class="front-content">
      <div class="about-layout">

        <!-- LEFT: photo + info -->
        <div class="about-left">
          <div class="about-photo-wrap">
            <img src="photo.jpg" alt="Jeb Farneth"
              onerror="this.parentElement.style.background='#d4c9b0';this.style.display='none'">
          </div>

          <div>
            <div class="about-interests"><span>Education</span></div>
            <div class="about-degree">
              Fordham University<br>
              M.S. Business Analytics<br>
              Expected May 2027<br>
              <br>
              SUNY Cortland<br>
              B.S. Business Economics<br>
              Aug 2024
            </div>
            <div class="about-tagline">Making complex systems legible.</div>
          </div>

          <div class="about-divider"></div>

          <div class="about-interests">
            <span>Interests &amp; Hobbies</span>
            Old maps, Roman history, catching up on the Buffalo Bills
          </div>
        </div>

        <!-- RIGHT: resume -->
        <div class="about-right">
          <div class="resume-embed">
            <div class="resume-placeholder">[ Resume PDF renders here ]</div>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>
</body>
</html>
